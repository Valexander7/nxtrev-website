<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3058a6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="34" fill="#3058a6" font-size="11" font-weight="700" letter-spacing="1.5">SOURCING SOLUTIONS</text>
  <text x="40" y="58" fill="#0f172a" font-size="19" font-weight="800">From requirement to delivery</text>
  <text x="40" y="80" fill="#64748b" font-size="12.5">How NXTREV moves a specialized part, tool, or system from identification to your dock.</text>

  <!-- Flow connectors (between nodes) -->
  <line x1="240" y1="200" x2="266" y2="200" stroke="#3058a6" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="470" y1="200" x2="496" y2="200" stroke="#3058a6" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="700" y1="200" x2="726" y2="200" stroke="#3058a6" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="930" y1="200" x2="956" y2="200" stroke="#3058a6" stroke-width="2" marker-end="url(#flow)"/>

  <!-- STEP 1 -->
  <g transform="translate(40, 130)">
    <rect width="200" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3058a6"/>
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="52" y="33" fill="#0f172a" font-size="13.5" font-weight="700">Identify</text>
    <text x="18" y="66" fill="#475569" font-size="11.5">Pin down the exact part,</text>
    <text x="18" y="82" fill="#475569" font-size="11.5">spec, or equipment the</text>
    <text x="18" y="98" fill="#475569" font-size="11.5">operation needs.</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(270, 130)">
    <rect width="200" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3058a6"/>
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">2</text>
    <text x="52" y="33" fill="#0f172a" font-size="13.5" font-weight="700">Source</text>
    <text x="18" y="66" fill="#475569" font-size="11.5">Qualify suppliers and</text>
    <text x="18" y="82" fill="#475569" font-size="11.5">negotiate with overseas</text>
    <text x="18" y="98" fill="#475569" font-size="11.5">principals.</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(500, 130)">
    <rect width="200" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3058a6"/>
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="52" y="33" fill="#0f172a" font-size="13.5" font-weight="700">Quote &amp; order</text>
    <text x="18" y="66" fill="#475569" font-size="11.5">Consolidate pricing and</text>
    <text x="18" y="82" fill="#475569" font-size="11.5">place the order against</text>
    <text x="18" y="98" fill="#475569" font-size="11.5">your requirement.</text>
  </g>

  <!-- STEP 4 (coordination — highlighted) -->
  <g transform="translate(730, 130)">
    <rect width="200" height="140" rx="10" fill="#eef4fc" stroke="#3058a6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3058a6"/>
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">4</text>
    <text x="52" y="33" fill="#1e3a8a" font-size="13.5" font-weight="700">Ship &amp; clear</text>
    <text x="18" y="64" fill="#334155" font-size="11.5">PEZA / free-zone shipment</text>
    <text x="18" y="80" fill="#334155" font-size="11.5">coordination with your</text>
    <text x="18" y="96" fill="#334155" font-size="11.5">appointed freight forwarder</text>
    <text x="18" y="112" fill="#334155" font-size="11.5">and licensed customs broker.</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(960, 130)">
    <rect width="200" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3058a6"/>
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <text x="52" y="33" fill="#0f172a" font-size="13.5" font-weight="700">Deliver</text>
    <text x="18" y="66" fill="#475569" font-size="11.5">On-site handover to your</text>
    <text x="18" y="82" fill="#475569" font-size="11.5">operation, ready for</text>
    <text x="18" y="98" fill="#475569" font-size="11.5">qualification.</text>
  </g>

  <!-- Concept disclaimer -->
  <text x="40" y="342" fill="#94a3b8" font-size="11" font-style="italic">Concept illustration of the sourcing workflow — NXTREV coordinates; customs clearance and freight are handled with the customer's appointed broker and forwarder.</text>
</svg>
