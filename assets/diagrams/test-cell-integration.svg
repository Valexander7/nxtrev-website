<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color: #0b132b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Solid Navy & Slate Styling - No Purple / No Green -->
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3058a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Title & Context Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5" text-transform="uppercase">Subsystem Architecture Map</text>
    <text x="0" y="28" fill="#ffffff" font-size="22" font-weight="800">Test Cell Component Relationship Diagram</text>
    <text x="0" y="50" fill="#94a3b8" font-size="13">Functional interconnects between electrical test instrumentation, docking interface, and alternative handling configurations</text>
  </g>

  <!-- SECTION 1: ATE Test System -->
  <g transform="translate(40, 110)">
    <rect width="260" height="370" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="5" rx="2" fill="#3058a6"/>
    
    <text x="20" y="32" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">ELECTRICAL SUBSYSTEM</text>
    <text x="20" y="58" fill="#ffffff" font-size="17" font-weight="700">ATE Test System</text>
    <text x="20" y="78" fill="#94a3b8" font-size="12">Instrumentation &amp; Control</text>

    <line x1="20" y1="92" x2="240" y2="92" stroke="#334155" stroke-width="1"/>

    <text x="20" y="122" fill="#e2e8f0" font-size="13">• System Power Supplies</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="13">• Source &amp; Measure Units (SMUs)</text>
    <text x="20" y="178" fill="#e2e8f0" font-size="13">• Digital &amp; Analog Pin Channels</text>
    <text x="20" y="206" fill="#e2e8f0" font-size="13">• High-Voltage / Current Drivers</text>
    <text x="20" y="234" fill="#e2e8f0" font-size="13">• Test Executive &amp; OS Engine</text>

    <g transform="translate(20, 275)">
      <rect width="220" height="75" rx="4" fill="#070d1e" stroke="#1e293b"/>
      <text x="110" y="24" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Signal Generation &amp; Capture</text>
      <text x="110" y="44" fill="#64748b" font-size="10.5" text-anchor="middle">Hardware options selected to</text>
      <text x="110" y="60" fill="#64748b" font-size="10.5" text-anchor="middle">match device test envelope</text>
    </g>
  </g>

  <!-- Labeled Bidirectional Connector: ATE <-> Interface -->
  <g transform="translate(300, 260)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <circle cx="60" cy="0" r="4" fill="#38bdf8"/>
    <rect x="5" y="-22" width="50" height="16" rx="3" fill="#070d1e" stroke="#334155"/>
    <text x="30" y="-10" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">I/O BUS</text>
  </g>

  <!-- SECTION 2: Docking & Interface -->
  <g transform="translate(360, 110)">
    <rect width="260" height="370" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="5" rx="2" fill="#38bdf8"/>
    
    <text x="20" y="32" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">COUPLING SUBSYSTEM</text>
    <text x="20" y="58" fill="#ffffff" font-size="17" font-weight="700">Docking &amp; Interface</text>
    <text x="20" y="78" fill="#94a3b8" font-size="12">Signal &amp; Mechanical Link</text>

    <line x1="20" y1="92" x2="240" y2="92" stroke="#334155" stroke-width="1"/>

    <text x="20" y="122" fill="#e2e8f0" font-size="13">• Mechanical Docking Assembly</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="13">• Device Interface Board (DIB)</text>
    <text x="20" y="178" fill="#e2e8f0" font-size="13">• Contactor Sockets (Final Test)</text>
    <text x="20" y="206" fill="#e2e8f0" font-size="13">• Probe Card (Wafer Sort)</text>
    <text x="20" y="234" fill="#e2e8f0" font-size="13">• Alignment / Locking Hardware</text>

    <g transform="translate(20, 275)">
      <rect width="220" height="75" rx="4" fill="#070d1e" stroke="#1e293b"/>
      <text x="110" y="26" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Application Engineering</text>
      <text x="110" y="46" fill="#94a3b8" font-size="10.5" text-anchor="middle">Interface selected or engineered</text>
      <text x="110" y="62" fill="#94a3b8" font-size="10.5" text-anchor="middle">for the specific application</text>
    </g>
  </g>

  <!-- Labeled Branch Connectors to Configurations A & B -->
  <g transform="translate(620, 200)">
    <path d="M 0 95 L 30 95 L 30 10 L 55 10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="55" cy="10" r="3.5" fill="#38bdf8"/>
    <rect x="5" y="38" width="54" height="18" rx="3" fill="#070d1e" stroke="#334155"/>
    <text x="32" y="51" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">CONFIG A</text>
  </g>

  <g transform="translate(620, 290)">
    <path d="M 0 5 L 30 5 L 30 90 L 55 90" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="55" cy="90" r="3.5" fill="#38bdf8"/>
    <rect x="5" y="38" width="54" height="18" rx="3" fill="#070d1e" stroke="#334155"/>
    <text x="32" y="51" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">CONFIG B</text>
  </g>

  <!-- CONFIGURATION A: Packaged Device Handling (Top Right Branch) -->
  <g transform="translate(675, 110)">
    <rect width="250" height="175" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#3058a6"/>
    
    <text x="16" y="26" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">CONFIG A: PACKAGED UNITS</text>
    <text x="16" y="48" fill="#ffffff" font-size="15" font-weight="700">Package Handler</text>
    
    <text x="16" y="74" fill="#cbd5e1" font-size="12">• Pick-and-place, turret, gravity,</text>
    <text x="24" y="92" fill="#cbd5e1" font-size="12">or strip handling mechanisms</text>
    <text x="16" y="116" fill="#cbd5e1" font-size="12">• Thermal conditioning (optional)</text>
    <text x="16" y="140" fill="#cbd5e1" font-size="12">• Physical pass/fail unit binning</text>
    <text x="24" y="158" fill="#94a3b8" font-size="11">and sorting into hardware bins</text>
  </g>

  <!-- Downstream Connector to Optional Packaging -->
  <g transform="translate(925, 195)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="35" cy="0" r="3" fill="#64748b"/>
  </g>

  <!-- DOWNSTREAM OPTION (Packaged Device Only): Inspection & Packaging -->
  <g transform="translate(960, 110)">
    <rect width="200" height="175" rx="8" fill="#070d1e" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="16" y="14" width="76" height="18" rx="3" fill="#1e293b"/>
    <text x="54" y="27" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">OPTIONAL</text>
    
    <text x="16" y="52" fill="#ffffff" font-size="14" font-weight="700">Post-Test Options</text>
    <text x="16" y="70" fill="#64748b" font-size="11">Packaged Units Only</text>

    <text x="16" y="98" fill="#cbd5e1" font-size="11.5">• Optical mark inspection</text>
    <text x="16" y="120" fill="#cbd5e1" font-size="11.5">• Lead / ball coplanarity</text>
    <text x="16" y="142" fill="#cbd5e1" font-size="11.5">• Tape &amp; reel packaging</text>
    <text x="16" y="162" fill="#cbd5e1" font-size="11.5">• Automated tray packing</text>
  </g>

  <!-- CONFIGURATION B: Wafer Sort (Bottom Right Branch) -->
  <g transform="translate(675, 305)">
    <rect width="250" height="175" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#3058a6"/>
    
    <text x="16" y="26" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">CONFIG B: WAFER SORT</text>
    <text x="16" y="48" fill="#ffffff" font-size="15" font-weight="700">Wafer Prober</text>
    
    <text x="16" y="74" fill="#cbd5e1" font-size="12">• Automated wafer chuck stepping</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12">• Optical die alignment</text>
    <text x="16" y="122" fill="#cbd5e1" font-size="12">• Precision Z-axis contact</text>
    <text x="16" y="146" fill="#cbd5e1" font-size="12">• Ambient or hot chuck control</text>
  </g>

  <!-- Downstream Connector to Wafer Sort Output -->
  <g transform="translate(925, 390)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="35" cy="0" r="3" fill="#38bdf8"/>
  </g>

  <!-- WAFER SORT OUTCOME: Electronic Wafer Map / Die Map -->
  <g transform="translate(960, 305)">
    <rect width="200" height="175" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#38bdf8"/>
    
    <text x="16" y="26" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">DATA OUTCOME</text>
    <text x="16" y="48" fill="#ffffff" font-size="14" font-weight="700">Wafer Sort Output</text>
    <text x="16" y="68" fill="#94a3b8" font-size="11">Die Results &amp; Records</text>

    <text x="16" y="96" fill="#cbd5e1" font-size="11.5">• Electronic wafer map</text>
    <text x="16" y="118" fill="#cbd5e1" font-size="11.5">• Per-die bin recording</text>
    <text x="16" y="140" fill="#cbd5e1" font-size="11.5">• Physical inking (optional)</text>
    <text x="16" y="162" fill="#cbd5e1" font-size="11.5">• Yield summary datalog</text>
  </g>

  <!-- Short In-Diagram Identifier (Full legal disclaimer is rendered in semantic HTML) -->
  <g transform="translate(40, 500)">
    <text x="0" y="24" fill="#64748b" font-size="11" font-style="italic">
      Concept illustration of subsystem relationships — not a specific machine layout or guaranteed configuration.
    </text>
  </g>
</svg>