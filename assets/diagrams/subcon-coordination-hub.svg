<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <!-- Header -->
  <text x="40" y="34" fill="#3058a6" font-size="11" font-weight="700" letter-spacing="1.5">SUBCONTRACTOR MANAGEMENT</text>
  <text x="40" y="58" fill="#0f172a" font-size="19" font-weight="800">One coordinating point across the subcontracting chain</text>
  <text x="40" y="80" fill="#64748b" font-size="12.5">NXTREV sits between the customer, the factories, and the suppliers so accountability stays clear end to end.</text>

  <!-- Connectors (drawn behind nodes and label chips) -->
  <g stroke="#93b4e6" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="490" y1="256" x2="262" y2="164"/>
    <line x1="490" y1="256" x2="262" y2="348"/>
    <line x1="710" y1="256" x2="938" y2="164"/>
    <line x1="710" y1="256" x2="938" y2="348"/>
  </g>

  <!-- Connector label chips (white pill masks the line behind the text) -->
  <g font-size="11" font-weight="600" fill="#475569" text-anchor="middle">
    <g transform="translate(376,210)"><rect x="-80" y="-11" width="160" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="0" y="4">spec alignment · OTIF</text></g>
    <g transform="translate(376,302)"><rect x="-90" y="-11" width="180" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="0" y="4">scheduling · lot expediting</text></g>
    <g transform="translate(824,210)"><rect x="-68" y="-11" width="136" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="0" y="4">engineering liaison</text></g>
    <g transform="translate(824,302)"><rect x="-60" y="-11" width="120" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="0" y="4">yield · RCA · CI</text></g>
  </g>

  <!-- Center hub -->
  <g transform="translate(490, 210)">
    <rect width="220" height="92" rx="12" fill="#0b132b" stroke="#3058a6" stroke-width="2"/>
    <text x="110" y="40" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">NXTREV</text>
    <text x="110" y="62" fill="#93b4e6" font-size="12.5" font-weight="600" text-anchor="middle">Operations Coordination</text>
  </g>

  <!-- Node: Customer (top-left) -->
  <g transform="translate(60, 128)">
    <rect width="202" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="101" y="31" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Customer</text>
    <text x="101" y="51" fill="#64748b" font-size="11" text-anchor="middle">specs · drawings · delivery</text>
  </g>

  <!-- Node: Foundries & OSAT (bottom-left) -->
  <g transform="translate(60, 312)">
    <rect width="202" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="101" y="31" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Foundries &amp; OSAT</text>
    <text x="101" y="51" fill="#64748b" font-size="11" text-anchor="middle">assembly &amp; test subcontractors</text>
  </g>

  <!-- Node: Suppliers (top-right) -->
  <g transform="translate(938, 128)">
    <rect width="202" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="101" y="31" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Suppliers</text>
    <text x="101" y="51" fill="#64748b" font-size="11" text-anchor="middle">equipment &amp; materials</text>
  </g>

  <!-- Node: Quality & Engineering (bottom-right) -->
  <g transform="translate(938, 312)">
    <rect width="202" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="101" y="31" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Quality &amp; Engineering</text>
    <text x="101" y="51" fill="#64748b" font-size="11" text-anchor="middle">yield · failure analysis</text>
  </g>

  <!-- Concept disclaimer -->
  <text x="40" y="424" fill="#94a3b8" font-size="11" font-style="italic">Concept illustration of the coordination role — not an organizational chart or a list of named partners.</text>
</svg>
