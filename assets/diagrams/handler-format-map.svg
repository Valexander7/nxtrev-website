<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3058a6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="34" fill="#3058a6" font-size="11" font-weight="700" letter-spacing="1.5">SELECTING A HANDLER</text>
  <text x="40" y="58" fill="#0f172a" font-size="19" font-weight="800">Match your device format to the handling method</text>
  <text x="40" y="80" fill="#64748b" font-size="12.5">The package or die format you start with determines the mechanism that feeds, tests, and sorts it.</text>

  <!-- Column frame guides (subtle) -->
  <!-- Each column: format (top) -> arrow -> handler (mid) -> package examples (bottom) -->

  <!-- ============ COLUMN 1: Small packaged units -> Rotary turret ============ -->
  <g transform="translate(40, 108)">
    <rect width="265" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- device format: small chips -->
    <text x="16" y="26" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">DEVICE FORMAT</text>
    <g transform="translate(16,40)">
      <rect x="0"  y="0" width="26" height="20" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="34" y="0" width="26" height="20" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="0"  y="28" width="26" height="20" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="34" y="28" width="26" height="20" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
    </g>
    <text x="96" y="60" fill="#0f172a" font-size="13.5" font-weight="700">Small packaged</text>
    <text x="96" y="78" fill="#0f172a" font-size="13.5" font-weight="700">units</text>
    <!-- arrow -->
    <line x1="132" y1="100" x2="132" y2="128" stroke="#3058a6" stroke-width="2" marker-end="url(#arr)"/>
    <!-- handler: rotary turret -->
    <g transform="translate(16,140)">
      <circle cx="26" cy="30" r="26" fill="none" stroke="#3058a6" stroke-width="2"/>
      <circle cx="26" cy="30" r="4" fill="#3058a6"/>
      <circle cx="26" cy="8"  r="3.5" fill="#3058a6"/>
      <circle cx="48" cy="30" r="3.5" fill="#3058a6"/>
      <circle cx="26" cy="52" r="3.5" fill="#3058a6"/>
      <circle cx="4"  cy="30" r="3.5" fill="#3058a6"/>
    </g>
    <text x="96" y="162" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">HANDLER</text>
    <text x="96" y="182" fill="#0f172a" font-size="13.5" font-weight="700">Rotary turret</text>
    <text x="96" y="200" fill="#0f172a" font-size="13.5" font-weight="700">+ taping</text>
    <!-- examples -->
    <line x1="16" y1="216" x2="249" y2="216" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="238" fill="#64748b" font-size="11.5">QFN · DFN · SOT · SOD · SMA</text>
  </g>

  <!-- ============ COLUMN 2: Leadframe strips -> Strip test / PnP ============ -->
  <g transform="translate(335, 108)">
    <rect width="265" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="26" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">DEVICE FORMAT</text>
    <!-- device format: leadframe strip -->
    <g transform="translate(16,44)">
      <rect x="0" y="6" width="64" height="22" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="6"  y="11" width="10" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="22" y="11" width="10" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="38" y="11" width="10" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="52" y="11" width="8"  height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8"/>
    </g>
    <text x="96" y="60" fill="#0f172a" font-size="13.5" font-weight="700">Leadframe</text>
    <text x="96" y="78" fill="#0f172a" font-size="13.5" font-weight="700">strips / matrix</text>
    <line x1="132" y1="100" x2="132" y2="128" stroke="#3058a6" stroke-width="2" marker-end="url(#arr)"/>
    <!-- handler: pick-and-place nozzle over strip -->
    <g transform="translate(16,140)">
      <rect x="0" y="40" width="56" height="16" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
      <line x1="28" y1="0" x2="28" y2="22" stroke="#3058a6" stroke-width="3"/>
      <path d="M22,22 L34,22 L28,34 Z" fill="#3058a6"/>
    </g>
    <text x="96" y="162" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">HANDLER</text>
    <text x="96" y="182" fill="#0f172a" font-size="13.5" font-weight="700">Strip test /</text>
    <text x="96" y="200" fill="#0f172a" font-size="13.5" font-weight="700">pick-and-place</text>
    <line x1="16" y1="216" x2="249" y2="216" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="238" fill="#64748b" font-size="11.5">Pre-singulation · high parallelism</text>
  </g>

  <!-- ============ COLUMN 3: Power discretes -> Gravity feed ============ -->
  <g transform="translate(630, 108)">
    <rect width="265" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="26" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">DEVICE FORMAT</text>
    <!-- device format: TO-220 power discrete -->
    <g transform="translate(16,42)">
      <rect x="6" y="4" width="44" height="24" rx="2" fill="#1e293b"/>
      <circle cx="28" cy="10" r="3" fill="#f8fafc"/>
      <rect x="12" y="28" width="4" height="12" fill="#94a3b8"/>
      <rect x="26" y="28" width="4" height="12" fill="#94a3b8"/>
      <rect x="40" y="28" width="4" height="12" fill="#94a3b8"/>
    </g>
    <text x="96" y="60" fill="#0f172a" font-size="13.5" font-weight="700">Power</text>
    <text x="96" y="78" fill="#0f172a" font-size="13.5" font-weight="700">discretes</text>
    <line x1="132" y1="100" x2="132" y2="128" stroke="#3058a6" stroke-width="2" marker-end="url(#arr)"/>
    <!-- handler: gravity feed tube -->
    <g transform="translate(16,140)">
      <path d="M8,0 L48,0 L34,26 L22,26 Z" fill="none" stroke="#3058a6" stroke-width="2"/>
      <rect x="24" y="26" width="8" height="30" fill="none" stroke="#3058a6" stroke-width="2"/>
      <rect x="26" y="34" width="4" height="4" fill="#94a3b8"/>
      <rect x="26" y="44" width="4" height="4" fill="#94a3b8"/>
    </g>
    <text x="96" y="162" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">HANDLER</text>
    <text x="96" y="182" fill="#0f172a" font-size="13.5" font-weight="700">Gravity feed</text>
    <text x="96" y="200" fill="#0f172a" font-size="13.5" font-weight="700">tube system</text>
    <line x1="16" y1="216" x2="249" y2="216" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="238" fill="#64748b" font-size="11.5">TO-220 · TO-247 · DPAK · Bridge</text>
  </g>

  <!-- ============ COLUMN 4: Bare die / wafer -> KGD / prober ============ -->
  <g transform="translate(925, 108)">
    <rect width="265" height="252" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="26" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">DEVICE FORMAT</text>
    <!-- device format: wafer + loose die -->
    <g transform="translate(16,40)">
      <circle cx="24" cy="20" r="20" fill="#e2e8f0" stroke="#94a3b8"/>
      <line x1="10" y1="12" x2="38" y2="12" stroke="#cbd5e1"/>
      <line x1="8"  y1="22" x2="40" y2="22" stroke="#cbd5e1"/>
      <line x1="16" y1="6"  x2="16" y2="34" stroke="#cbd5e1"/>
      <line x1="30" y1="6"  x2="30" y2="34" stroke="#cbd5e1"/>
      <rect x="50" y="14" width="12" height="12" rx="1" fill="#cbd5e1" stroke="#94a3b8"/>
    </g>
    <text x="96" y="60" fill="#0f172a" font-size="13.5" font-weight="700">Bare die</text>
    <text x="96" y="78" fill="#0f172a" font-size="13.5" font-weight="700">/ wafer</text>
    <line x1="132" y1="100" x2="132" y2="128" stroke="#3058a6" stroke-width="2" marker-end="url(#arr)"/>
    <!-- handler: prober chuck + probe card -->
    <g transform="translate(16,140)">
      <rect x="4" y="34" width="48" height="8" rx="1" fill="#94a3b8"/>
      <rect x="10" y="18" width="36" height="6" rx="1" fill="#3058a6"/>
      <line x1="18" y1="24" x2="18" y2="34" stroke="#3058a6" stroke-width="1.5"/>
      <line x1="28" y1="24" x2="28" y2="34" stroke="#3058a6" stroke-width="1.5"/>
      <line x1="38" y1="24" x2="38" y2="34" stroke="#3058a6" stroke-width="1.5"/>
    </g>
    <text x="96" y="162" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">HANDLER</text>
    <text x="96" y="182" fill="#0f172a" font-size="13.5" font-weight="700">KGD sorter /</text>
    <text x="96" y="200" fill="#0f172a" font-size="13.5" font-weight="700">prober · WLBI</text>
    <line x1="16" y1="216" x2="249" y2="216" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="238" fill="#64748b" font-size="11.5">Chiplets · gel-pak · waffle · tape</text>
  </g>

  <!-- Concept disclaimer -->
  <text x="40" y="386" fill="#94a3b8" font-size="11" font-style="italic">Concept illustration of handling principles — not a specific machine layout or guaranteed configuration.</text>
</svg>
