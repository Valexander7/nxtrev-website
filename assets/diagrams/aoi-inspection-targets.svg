<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#3058a6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="34" fill="#3058a6" font-size="11" font-weight="700" letter-spacing="1.5">WHAT AOI CHECKS</text>
  <text x="40" y="58" fill="#0f172a" font-size="19" font-weight="800">Inspection targets across package formats</text>
  <text x="40" y="80" fill="#64748b" font-size="12.5">Optical systems verify physical and marking defects that electrical test alone cannot catch.</text>

  <!-- ============ LEFT: Top view of a packaged device with callouts ============ -->
  <g transform="translate(70, 130)">
    <!-- package body -->
    <rect x="60" y="40" width="150" height="150" rx="6" fill="#1e293b"/>
    <!-- die -->
    <rect x="105" y="85" width="60" height="60" rx="2" fill="#334155" stroke="#475569"/>
    <!-- wire bonds (curves from die to leads) -->
    <path d="M105,95 Q80,80 70,70"  fill="none" stroke="#e2b13c" stroke-width="2"/>
    <path d="M105,135 Q80,150 70,160" fill="none" stroke="#e2b13c" stroke-width="2"/>
    <path d="M165,95 Q190,80 200,70"  fill="none" stroke="#e2b13c" stroke-width="2"/>
    <path d="M165,135 Q190,150 200,160" fill="none" stroke="#e2b13c" stroke-width="2"/>
    <!-- leads -->
    <g fill="#cbd5e1" stroke="#94a3b8">
      <rect x="66" y="60" width="12" height="6" rx="1"/>
      <rect x="66" y="164" width="12" height="6" rx="1"/>
      <rect x="192" y="60" width="12" height="6" rx="1"/>
      <rect x="192" y="164" width="12" height="6" rx="1"/>
    </g>
    <!-- marking text block on body -->
    <rect x="118" y="108" width="34" height="14" rx="1" fill="#0f172a" stroke="#475569"/>

    <!-- Callout: marking -->
    <line x1="135" y1="115" x2="300" y2="115" stroke="#3058a6" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="308" y="112" fill="#0f172a" font-size="13.5" font-weight="700">Marking legibility</text>
    <text x="308" y="130" fill="#64748b" font-size="11.5">Part number, lot, orientation</text>

    <!-- Callout: wire bond -->
    <line x1="120" y1="90" x2="300" y2="60" stroke="#3058a6" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="308" y="57" fill="#0f172a" font-size="13.5" font-weight="700">Wire bond &amp; epoxy</text>
    <text x="308" y="75" fill="#64748b" font-size="11.5">Sweep, tail, bleeding, bridging</text>

    <!-- Callout: surface -->
    <line x1="180" y1="150" x2="300" y2="180" stroke="#3058a6" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="308" y="177" fill="#0f172a" font-size="13.5" font-weight="700">Surface &amp; edge</text>
    <text x="308" y="195" fill="#64748b" font-size="11.5">Chipping, cracks, plating voids</text>
  </g>

  <!-- ============ RIGHT TOP: Lead coplanarity side view ============ -->
  <g transform="translate(720, 130)">
    <text x="0" y="0" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">LEAD COPLANARITY</text>
    <!-- reference line -->
    <line x1="0" y1="70" x2="180" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- package body side -->
    <rect x="40" y="30" width="100" height="30" rx="3" fill="#1e293b"/>
    <!-- leads: some touch line, one bent up -->
    <path d="M40,60 L28,70 L28,78" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M140,60 L152,70 L152,78" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M70,60 L64,66 L64,60" fill="none" stroke="#e2b13c" stroke-width="3"/>
    <text x="0" y="100" fill="#0f172a" font-size="12.5" font-weight="700">Leads within spec height</text>
    <text x="0" y="118" fill="#64748b" font-size="11.5">Bent or lifted leads flagged</text>
  </g>

  <!-- ============ RIGHT BOTTOM: Warpage profile curve ============ -->
  <g transform="translate(960, 130)">
    <text x="0" y="0" fill="#3058a6" font-size="10" font-weight="700" letter-spacing="0.8">3D WARPAGE PROFILE</text>
    <!-- axis -->
    <line x1="0" y1="90" x2="180" y2="90" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="108" fill="#94a3b8" font-size="9">edge</text>
    <text x="150" y="108" fill="#94a3b8" font-size="9">edge</text>
    <!-- bowed package profile (concave) -->
    <path d="M10,50 Q90,96 170,50" fill="none" stroke="#3058a6" stroke-width="3"/>
    <!-- measurement arrows -->
    <line x1="90" y1="73" x2="90" y2="90" stroke="#e2b13c" stroke-width="1.5"/>
    <path d="M86,75 L94,75 L90,68 Z" fill="#e2b13c"/>
    <text x="96" y="72" fill="#e2b13c" font-size="11" font-weight="700">Δh</text>
    <text x="0" y="130" fill="#0f172a" font-size="12.5" font-weight="700">Deformation vs temperature</text>
    <text x="0" y="148" fill="#64748b" font-size="11.5">Bow / twist across reflow profile</text>
  </g>

  <!-- Concept disclaimer -->
  <text x="40" y="386" fill="#94a3b8" font-size="11" font-style="italic">Concept illustration of typical inspection targets — actual checks depend on package and customer criteria.</text>
</svg>
